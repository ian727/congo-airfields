title: "Little-known and abandoned airfields in the DRC"
description: "A documentation project for airports and airstrips in the Democratic Republic of the Congo."

theme: null

include:
  - _layouts
  - _includes
  - _sass
  - assets

exclude:
  - airports
  - airports_fr
  - about.md
  - about_fr.md
  - list.md
  - list_fr.md
  - listold.md
  - map.md
  - map_fr.md
  - index_fr.md
  - P1020698.JPG
  - to-do.txt

url: "https://ian727.github.io"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - index.md

defaults:
  - scope:
      path: "_layouts"
    values:
      sitemap: false
  - scope:
      path: "_includes"
    values:
      sitemap: false
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "_sass/minima/"
    values:
      sitemap: false

markdown: kramdown
highlighter: rouge
